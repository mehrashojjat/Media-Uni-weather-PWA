<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body { overscroll-behavior: none; }
    ::-webkit-scrollbar { display: none; }
    [hidden] { display: none !important; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: {
          "on-surface": "#dde2f5", "on-surface-variant": "#c0c6d6",
          "surface-container-low": "#161b29", "surface-container-highest": "#2f3543",
          "surface-container": "#1a1f2d", "outline": "#8b91a0",
          "outline-variant": "#414754", "primary": "#aac7ff",
          "primary-container": "#3e90ff", "on-primary": "#003064",
          "secondary": "#ffc07a", "secondary-container": "#fa9b00",
          "tertiary": "#47e266"
        },
        fontFamily: { body: ["Plus Jakarta Sans", "sans-serif"] }
      } }
    };
  </script>
  <script src="weather.js" defer></script>
</head>
<body class="bg-[#0a0f1d] font-body text-on-surface antialiased min-h-screen selection:bg-primary-container selection:text-on-primary relative overflow-x-hidden">
  <div class="fixed top-[-100px] left-1/2 -translate-x-1/2 w-[700px] h-[400px] bg-gradient-to-b from-primary-container/15 via-secondary/10 to-transparent rounded-full blur-[140px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-0 right-1/4 w-[450px] h-[350px] bg-primary/5 rounded-full blur-[130px] pointer-events-none -z-10"></div>
  <header class="w-full pt-8 pb-4 flex justify-center items-center">
    <div class="flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-surface-container-low/40 border border-outline-variant/30 backdrop-blur-xl">
      <span class="material-symbols-outlined text-[18px] text-primary" aria-hidden="true">cloud</span>
      <span class="text-xs font-medium tracking-widest uppercase text-on-surface-variant">Weather</span>
    </div>
  </header>
  <main class="w-full max-w-4xl mx-auto px-6 py-6 flex flex-col gap-10">
    <section class="flex flex-col items-center text-center pt-2">
      <form id="search-form" class="w-full max-w-lg relative" role="search">
        <div class="flex items-center gap-3 px-6 py-2 rounded-2xl bg-surface-container-low/40 border border-outline-variant/30 focus-within:border-primary/50 backdrop-blur-xl shadow-lg">
          <span class="material-symbols-outlined text-[24px] text-outline" aria-hidden="true">search</span>
          <input id="city-search" aria-label="Search for a city" aria-controls="search-results" autocomplete="off" class="w-full text-center text-2xl sm:text-3xl font-semibold tracking-tight text-on-surface bg-transparent outline-none border-none placeholder:text-outline/60" placeholder="Search for a city..." type="search">
          <button type="submit" class="text-sm text-primary font-semibold">Search</button>
        </div>
        <div id="search-results" class="absolute z-10 mt-2 w-full rounded-2xl bg-[#1a1f2d] border border-outline-variant text-left shadow-xl overflow-hidden" hidden></div>
      </form>
      <p id="search-status" class="text-sm text-on-surface-variant mt-2" role="status" aria-live="polite"></p>
      <p id="weather-status" class="text-sm text-on-surface-variant mt-2" role="status" aria-live="polite">Loading weather...</p>
      <div id="current-weather" hidden>
        <h1 id="location" class="text-lg text-on-surface-variant font-medium mt-3"></h1>
        <div class="flex items-baseline justify-center mt-2">
          <span id="temperature" class="text-7xl sm:text-8xl font-extralight tracking-tighter text-on-surface"></span>
          <span class="text-3xl font-light text-primary">°F</span>
        </div>
        <p id="conditions" class="text-lg text-on-surface-variant font-medium mt-1"></p>
        <p class="text-sm text-outline mt-1.5">H: <strong id="high" class="text-on-surface"></strong> &nbsp; L: <strong id="low" class="text-on-surface"></strong></p>
        <p id="updated" class="text-xs text-outline mt-2"></p>
      </div>
    </section>
    <div id="forecast" class="flex flex-col gap-6" hidden>
      <section aria-label="Hourly forecast" class="w-full rounded-3xl bg-surface-container-low/50 border border-outline-variant/20 backdrop-blur-2xl p-5 shadow-xl overflow-x-auto">
        <div id="hourly" class="grid grid-cols-7 gap-2 min-w-[420px]"></div>
      </section>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
        <section class="rounded-3xl bg-surface-container-low/50 border border-outline-variant/20 backdrop-blur-2xl p-6 shadow-xl">
          <h2 class="flex items-center gap-2 pb-4 text-xs font-semibold uppercase tracking-wider text-outline">
            <span class="material-symbols-outlined text-[16px] text-primary" aria-hidden="true">calendar_month</span> 7-Day Forecast
          </h2>
          <div id="daily" class="flex flex-col gap-3.5"></div>
        </section>
        <div class="grid grid-cols-2 gap-4">
          <section class="rounded-3xl bg-surface-container-low/50 border border-outline-variant/20 p-5 shadow-xl">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-outline">Wind</h2>
            <p id="wind" class="text-3xl font-bold mt-4"></p>
            <p id="wind-direction" class="text-xs text-outline mt-1"></p>
          </section>
          <section class="rounded-3xl bg-surface-container-low/50 border border-outline-variant/20 p-5 shadow-xl">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-outline">Humidity</h2>
            <p id="humidity" class="text-3xl font-bold mt-4"></p>
            <p id="feels-like" class="text-xs text-outline mt-1"></p>
          </section>
          <section class="rounded-3xl bg-surface-container-low/50 border border-outline-variant/20 p-5 shadow-xl">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-outline">UV Index</h2>
            <p id="uv" class="text-3xl font-bold mt-4"></p>
            <p id="uv-label" class="text-xs text-outline mt-1"></p>
          </section>
          <section class="rounded-3xl bg-surface-container-low/50 border border-outline-variant/20 p-5 shadow-xl">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-outline">Air Quality</h2>
            <p id="air-quality" class="text-3xl font-bold mt-4"></p>
            <p id="air-quality-label" class="text-xs text-outline mt-1"></p>
          </section>
        </div>
      </div>
    </div>
    <noscript>JavaScript is required to search for and display weather.</noscript>
  </main>
  <footer class="w-full py-8 text-center text-xs text-outline">Weather data by <a class="text-primary" href="https://open-meteo.com/">Open-Meteo</a></footer>
</body>
</html>
